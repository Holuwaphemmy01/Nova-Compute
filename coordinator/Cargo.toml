[package]
name = "nova-coordinator"
version = "0.1.0"
description = "Nova Compute coordinator: jobs, chunk scheduling, verification, oracle attestations and BCH payouts"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "nova_coordinator"
path = "src/lib.rs"

[dependencies]
nova-kernel = { path = "../kernel" }
sha2 = "0.10"
ripemd = "0.1"
hmac = "0.12"
hex = "0.4"
k256 = { version = "0.13", features = ["arithmetic", "ecdsa", "expose-field"] }
bs58 = { version = "0.5", features = ["check"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
async-trait = "0.1"
tracing = "0.1"
