[package]
name = "nova-worker"
version = "0.1.0"
description = "Native Nova Compute provider: takes pieces from a coordinator, computes them with the Nova kernel, earns BCH"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "nova-worker"
path = "src/main.rs"

[dependencies]
nova-kernel = { path = "../kernel" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ctrlc = "3"
