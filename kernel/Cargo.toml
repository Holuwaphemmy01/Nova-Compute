[package]
name = "nova-kernel"
version = "0.1.0"
description = "Deterministic Monte Carlo neutron-transport chunk kernel for Nova Compute (native + WASM)"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "nova_kernel"
crate-type = ["cdylib", "rlib"]

[dependencies]
libm = "0.2"
rand_chacha = { version = "0.9", default-features = false }
rand_core = "0.9"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3"
